<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estúdio de Identidade · Vós</title>
<meta name="description" content="Plataforma para desenhar identidades visuais de sites de software a partir das características que o cliente sente: elegância, minimalismo, humor, época, feitura, energia e luz.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=Caveat:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@400;500;700&family=Epilogue:wght@400;600&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;600;800&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Syne:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23FF6A1F'/%3E%3Ccircle cx='60' cy='60' r='24' fill='%230B0A09'/%3E%3C/svg%3E">
</head>
<body>

<header class="topo">
  <div class="marca-topo">
    <b>Estúdio de <i>Identidade</i></b>
    <span>para sites de software</span>
  </div>
  <div class="topo-dir">
    <button class="pilula" data-acao="copiar-link" title="Gera um link que carrega esta identidade inteira">Copiar link</button>
    <button class="pilula pilula--forte" data-acao="ir" data-valor="8">Ver entrega</button>
  </div>
</header>

<div class="app" id="app">

  <nav class="trilha" id="trilha" aria-label="Etapas"></nav>

  <main class="obra">
    <header>
      <h1 id="etapa-titulo"></h1>
      <p id="etapa-sub"></p>
    </header>
    <div id="conteudo"></div>
  </main>

  <aside class="lado" aria-label="Identidade em construção">
    <div class="lado-topo">
      <button class="aba" data-aba="painel">Painel de marca</button>
      <button class="aba" data-aba="previa">Prévia do site</button>
      <span class="legenda">atualiza a cada escolha</span>
    </div>
    <div class="painel" id="painel"></div>
  </aside>

  <div class="nav-rodape">
    <button class="pilula" id="btn-voltar" data-acao="voltar">← Voltar</button>
    <button class="pilula pilula--forte" id="btn-avancar" data-acao="avancar">Continuar →</button>
    <button class="pilula so-mobile" data-acao="ver-painel">Ver painel ↓</button>
    <span class="conta">as setas do teclado também navegam</span>
  </div>

</div>

<div id="aviso" role="status" aria-live="polite"></div>

<script src="js/dados.js"></script>
<script src="js/motor.js"></script>
<script src="js/simbolos.js"></script>
<script src="js/painel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
